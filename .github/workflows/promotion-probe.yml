name: promotion-probe

# Приёмка P29 (карточка #68, этап I10): пересоздание чистой песочницы и прогон промоушена
# на двух настоящих процессах API/Runner одной машины. Проба поднимает воркеров, держит
# воркер на «зависшем» движке для проверки отката и гасит их сама; отдельный workflow_dispatch
# не нужен, состояние прогона изолировано в fleet-root этого job.
#
# Fleet-root и транскрипт — только внутри рабочего каталога job: /tmp и домашний каталог
# раннера проба не трогает.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Чистая песочница (новый namespace эксперимента)
        run: scripts/recreate-sandbox.sh --namespace p29-ci --fleet-root "$PWD/.p29-fleet" --owner "$(id -un)"

      - name: Проба промоушена и fleet acceptance
        run: node scripts/promotion-probe.mjs --fleet-root "$PWD/.p29-fleet" --namespace p29-ci --out "$PWD/.p29-fleet/out"

      - name: Транскрипт в артефакт job
        if: always()
        run: |
          set -uo pipefail
          if [ -f .p29-fleet/out/transcript.sha256 ]; then
            (cd .p29-fleet/out && sha256sum -c transcript.sha256)
            {
              echo '### Проба промоушена (P29, I10)'
              echo '```'
              cat .p29-fleet/out/transcript.sha256
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Транскрипт sanitized-по-конструкции; наружу уходит только он, а не весь
            # fleet-root, в котором лежат свежие ключи песочницы и данные прогонов.
            tar -czf "$RUNNER_TEMP/promotion-transcript.tgz" -C .p29-fleet/out .
          else
            echo 'транскрипт не собран' >&2
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p29-promotion-transcript
          path: ${{ runner.temp }}/promotion-transcript.tgz
          retention-days: 14

      - name: Секреты песочницы не попали в транскрипт (повторная проверка в CI)
        if: always()
        run: |
          set -euo pipefail
          if grep -q 'ak_' .p29-fleet/out/transcript.json; then
            echo 'в транскрипте есть значение ключа' >&2
            exit 1
          fi
          echo 'значений ключей в транскрипте нет'
