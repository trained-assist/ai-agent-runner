name: Signed VM worker release

on:
  push:
    tags: ['vm-worker-v*']
  workflow_dispatch:
    inputs:
      build_tag:
        description: Tag to build and publish (used by the promotion hook)
        required: false
        type: string
      release_tag:
        description: Existing signed release to deploy to the France sandbox
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.build_tag || inputs.release_tag }}

jobs:
  build-and-attest:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch origin main
          tagged_commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tagged_commit" origin/main
          echo "Tag ${{ env.RELEASE_TAG }} points at $tagged_commit, which is on main."
      - name: Download and verify pinned OpenCode fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Пин форка лежит в файле данных, а не в конфигурации workflow:
          # токен GitHub Actions не может изменить файл под
          # .github/workflows, поэтому пин в самом workflow обновлял только
          # человек, и хук промоушена доставлял новую сборку вручную.
          eval "$(node scripts/read-opencode-release-pin.mjs deploy/vm-worker/opencode-release-pin.json)"
          gh api --paginate --slurp 'repos/gpt-mem/opencode-mem/releases?per_page=100' > "$RUNNER_TEMP/opencode-releases.json"
          node scripts/assert-opencode-release-freshness.mjs "$RUNNER_TEMP/opencode-releases.json" \
            "$OPENCODE_RELEASE_TAG" "$OPENCODE_SOURCE_SHA" "$OPENCODE_ARCHIVE_SHA256"
          asset="opencode-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gpt-mem/opencode-mem/releases/download/${OPENCODE_RELEASE_TAG}/${asset}" \
            --output "$RUNNER_TEMP/$asset"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-fork"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/opencode-fork"
          test -x "$RUNNER_TEMP/opencode-fork/opencode"
          echo "$OPENCODE_BINARY_SHA256  $RUNNER_TEMP/opencode-fork/opencode" | sha256sum --check --status
          # Сборки форка печатают версию как "opencode v<version>", а пин хранит
          # версию без префикса: сравниваем нормализованные значения, иначе
          # любой бинарь v2-линии не проходит проверку.
          reported_opencode_version="$("$RUNNER_TEMP/opencode-fork/opencode" --version)"
          normalized_opencode_version="$(printf '%s' "$reported_opencode_version" | sed -E 's/^opencode[[:space:]]+v?//')"
          test "$normalized_opencode_version" = "$OPENCODE_VERSION"
          echo "OPENCODE_VERSION=$OPENCODE_VERSION" >> "$GITHUB_ENV"
          echo "OPENCODE_SOURCE_SHA=$OPENCODE_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "OPENCODE_BINARY_SHA256=$OPENCODE_BINARY_SHA256" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Assemble immutable Linux VM worker bundle
        id: bundle
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${{ env.RELEASE_TAG }}" = "vm-worker-v$VERSION"
          STAGE="$RUNNER_TEMP/vm-worker-bundle"
          mkdir -p "$STAGE"
          cp package.json package-lock.json "$STAGE/"
          cp -R dist "$STAGE/dist"
          install -m 0755 "$RUNNER_TEMP/opencode-fork/opencode" "$STAGE/opencode"
          mkdir -p "$STAGE/scripts"
          cp scripts/deploy-vm-worker-release.sh scripts/assert-vm-worker-update-ready.mjs scripts/select-vm-worker-inventory.mjs scripts/ai-agent-vm-worker-gha-update scripts/ai-agent-vm-worker-configure-production-ingress "$STAGE/scripts/"
          mkdir -p "$STAGE/deploy/vm-worker/inventory"
          cp deploy/vm-worker/inventory/france.json "$STAGE/deploy/vm-worker/inventory/"
          (cd "$STAGE" && npm ci --omit=dev)
          tar -czf ai-agent-vm-worker-linux-x64.tar.gz -C "$STAGE" .
          sha256sum ai-agent-vm-worker-linux-x64.tar.gz > ai-agent-vm-worker-linux-x64.tar.gz.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ai-agent-vm-worker-linux-x64.tar.gz
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            ai-agent-vm-worker-linux-x64.tar.gz \
            ai-agent-vm-worker-linux-x64.tar.gz.sha256 \
            --title "VM worker ${{ steps.bundle.outputs.version }}" \
            --generate-notes

  deploy-france-sandbox:
    name: Deploy signed release to France sandbox
    needs: build-and-attest
    if: ${{ always() && (needs.build-and-attest.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_tag == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: france-sandbox
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.FRANCE_VM_RELEASE_READ_TOKEN || github.token }}
      VM_DEPLOY_KEY: ${{ secrets.FRANCE_VM_RELEASE_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the host updater from this tagged release
        run: |
          set -euo pipefail
          # Апдейтер на хосте ставит себя сам — но только ПОСЛЕ успешной
          # установки. Старый апдейтер вправе отвергнуть бандл, который новый
          # поставил бы (например, из-за формата версии), и тогда релиз не
          # доедет до прода никогда. Поэтому перед вызовом доставляем апдейтер
          # из этого же тега по каналу деплоя: скрипт идёт в stdin после
          # строки с токеном, а собственные проверки апдейтера всё равно
          # сверяют подпись, дайджесты и метаданные бандла.
          install -m 0700 -d "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          install -m 0600 deploy/vm-worker/france-deploy-known-hosts "$RUNNER_TEMP/ssh/known_hosts"
          {
            printf '%s\n' "$GH_TOKEN"
            cat scripts/deploy-vm-worker-release.sh
          } | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=15 root@169.58.15.230 "install-updater"
      - name: Validate target release and deployment credential
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^vm-worker-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$VM_DEPLOY_KEY"
          if [[ "$GH_TOKEN" =~ ^[A-Za-z0-9_]{20,300}$ ]]; then
            echo 'GitHub release-read token matches the installed VM wrapper format.'
          elif [[ "$GH_TOKEN" =~ ^[[:graph:]]{20,4096}$ ]]; then
            echo 'GitHub release-read token requires the updated VM wrapper format.'
          else
            echo 'GitHub release-read token has an invalid format.' >&2
            exit 2
          fi
      - name: Update France sandbox after active runs drain
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^vm-worker-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          install -m 0700 -d "$RUNNER_TEMP/ssh"
          install -m 0600 /dev/null "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$VM_DEPLOY_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          install -m 0600 deploy/vm-worker/france-deploy-known-hosts "$RUNNER_TEMP/ssh/known_hosts"
          status=1
          for attempt in $(seq 1 30); do
            set +e
            printf '%s\n' "$GH_TOKEN" | ssh -i "$RUNNER_TEMP/ssh/id_ed25519" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
              -o ConnectTimeout=15 root@169.58.15.230 "update $RELEASE_TAG"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$status" -ne 75 ]]; then
              exit "$status"
            fi
            echo "France sandbox still has active runs; retry $attempt/30 in 30 seconds" >&2
            sleep 30
          done
          echo "France sandbox did not drain within 15 minutes; rerun this workflow with the same signed release tag" >&2
          exit 75
