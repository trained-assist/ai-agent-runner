name: Signed VM worker release

on:
  push:
    tags: ['vm-worker-v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download and verify pinned OpenCode fork
        env:
          OPENCODE_RELEASE_TAG: mem-v20261013-native-trace-af4e69c4be1e
          OPENCODE_VERSION: 0.0.0-native-trace-af4e69c4be1e-20261013
          OPENCODE_SOURCE_SHA: af4e69c4be1e4e36bc510cc6b1083571db4a4868
          OPENCODE_ARCHIVE_SHA256: 7b7b57a1c8762f6735f2d794c1a455dbdd4d83b5af9cd0532eba49337570d5b3
          OPENCODE_BINARY_SHA256: 1bed8883499b6e370208cf948b84c90a74369c934c566dab1deb501ef1cbea3d
        run: |
          set -euo pipefail
          asset="opencode-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gpt-mem/opencode-mem/releases/download/${OPENCODE_RELEASE_TAG}/${asset}" \
            --output "$RUNNER_TEMP/$asset"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-fork"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/opencode-fork"
          test -x "$RUNNER_TEMP/opencode-fork/opencode"
          echo "$OPENCODE_BINARY_SHA256  $RUNNER_TEMP/opencode-fork/opencode" | sha256sum --check --status
          test "$("$RUNNER_TEMP/opencode-fork/opencode" --version)" = "$OPENCODE_VERSION"
          echo "OPENCODE_VERSION=$OPENCODE_VERSION" >> "$GITHUB_ENV"
          echo "OPENCODE_SOURCE_SHA=$OPENCODE_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "OPENCODE_BINARY_SHA256=$OPENCODE_BINARY_SHA256" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Assemble immutable Linux VM worker bundle
        id: bundle
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "vm-worker-v$VERSION"
          STAGE="$RUNNER_TEMP/vm-worker-bundle"
          mkdir -p "$STAGE"
          cp package.json package-lock.json "$STAGE/"
          cp -R dist "$STAGE/dist"
          install -m 0755 "$RUNNER_TEMP/opencode-fork/opencode" "$STAGE/opencode"
          mkdir -p "$STAGE/scripts"
          cp scripts/deploy-vm-worker-release.sh "$STAGE/scripts/"
          (cd "$STAGE" && npm ci --omit=dev)
          tar -czf ai-agent-vm-worker-linux-x64.tar.gz -C "$STAGE" .
          sha256sum ai-agent-vm-worker-linux-x64.tar.gz > ai-agent-vm-worker-linux-x64.tar.gz.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ai-agent-vm-worker-linux-x64.tar.gz
      - name: Publish signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ai-agent-vm-worker-linux-x64.tar.gz \
            ai-agent-vm-worker-linux-x64.tar.gz.sha256 \
            --title "VM worker ${{ steps.bundle.outputs.version }}" \
            --generate-notes
