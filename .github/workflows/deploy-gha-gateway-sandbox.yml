name: Deploy GHA gateway sandbox

on:
  workflow_dispatch:
    inputs:
      gateway_ref:
        description: Exact GHA gateway branch, tag, or commit to verify and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: opencode-gha-gateway-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sandbox
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d740a05e9442c1d0feacae2dfc673e93
      GATEWAY_REF: ${{ inputs.gateway_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vovalikessmoothy-png/opencode-gha-runner
          ref: ${{ inputs.gateway_ref }}
          path: opencode-gha-runner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact gateway source
        id: gateway
        working-directory: opencode-gha-runner
        run: |
          set -euo pipefail
          [[ "$GATEWAY_REF" =~ ^[A-Za-z0-9._/-]{1,120}$ && "$GATEWAY_REF" != -* ]]
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Verify gateway tests
        working-directory: opencode-gha-runner
        run: |
          npm ci --no-audit --no-fund
          npm run verify
          npx wrangler deploy --dry-run --config wrangler.toml --env sandbox --var BUILD_SHA:${{ steps.gateway.outputs.sha }}
      - name: Verify Cloudflare account
        working-directory: opencode-gha-runner
        run: |
          set -euo pipefail
          identity="$(npx wrangler whoami 2>&1)"
          printf '%s\n' "$identity" | grep -F "$CLOUDFLARE_ACCOUNT_ID" >/dev/null
      - name: Deploy sandbox gateway from the verified source SHA
        working-directory: opencode-gha-runner
        env:
          GATEWAY_SHA: ${{ steps.gateway.outputs.sha }}
        run: npx wrangler deploy --config wrangler.toml --env sandbox --var "BUILD_SHA:$GATEWAY_SHA"
      - name: Verify delivered gateway SHA
        env:
          GATEWAY_SHA: ${{ steps.gateway.outputs.sha }}
        run: |
          set -euo pipefail
          url='https://opencode-gha-runner-gateway-sandbox.skillset-apply.workers.dev/version'
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$url" -o "$RUNNER_TEMP/gateway-version.json"; then
              node -e 'const x=require(process.argv[1]); if(x.service!=="opencode-gha-runner-gateway"||x.buildSha!==process.env.GATEWAY_SHA) process.exit(1)' "$RUNNER_TEMP/gateway-version.json" && break
            fi
            if [[ "$attempt" == 12 ]]; then echo 'sandbox gateway did not report the deployed source SHA' >&2; exit 1; fi
            sleep 5
          done
          printf 'Deployed sandbox gateway source SHA: %s\n' "$GATEWAY_SHA" >> "$GITHUB_STEP_SUMMARY"
