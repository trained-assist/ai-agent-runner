name: Deploy isolated production Cloudflare Runner API

on:
  workflow_run:
    workflows: [Deploy and pair isolated sandbox3 live profile auth]
    types: [completed]
  workflow_dispatch:
    inputs:
      sandbox_run_id:
        description: Successful sandbox3 profile-auth deploy run for this exact source SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-runner-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      SANDBOX_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.sandbox_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact source and production prerequisites
        env:
          SANDBOX_RUN_ID: ${{ env.SANDBOX_RUN_ID }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
          RUN_LAUNCH_ENCRYPTION_KEY: ${{ secrets.RUN_LAUNCH_ENCRYPTION_KEY }}
          EU_VM_WORKER_URL: ${{ secrets.EU_VM_WORKER_URL }}
          EU_VM_WORKER_TOKEN: ${{ secrets.EU_VM_WORKER_TOKEN }}
          GHA_WORKER_TOKEN_PRODUCTION_AGENT_API: ${{ secrets.GHA_WORKER_TOKEN_PRODUCTION_AGENT_API }}
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SANDBOX_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'production environment secret CF_API_TOKEN is missing' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo 'production environment variable CF_ACCOUNT_ID must contain the target account ID' >&2
            exit 1
          }
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_main" = "$SOURCE_SHA" || {
            echo 'production_promotion_skipped_source_is_behind_main' >&2
            exit 1
          }
          run="$(gh run view "$SANDBOX_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName,headSha,headBranch)"
          RUN_JSON="$run" node --input-type=module <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON);
          if (run.conclusion !== 'success'
            || run.workflowName !== 'Deploy and pair isolated sandbox3 live profile auth'
            || run.headSha !== process.env.SOURCE_SHA
            || run.headBranch !== 'main') {
            throw new Error('sandbox evidence must be a successful sandbox3 profile-auth deployment for this exact source SHA');
          }
          NODE
          identity="$(npx wrangler whoami 2>&1)"
          printf '%s\n' "$identity" | grep -F "$CLOUDFLARE_ACCOUNT_ID" >/dev/null || {
            echo 'Cloudflare credential does not target the configured production account' >&2
            exit 1
          }
          node tools/deploy-cloudflare-production.mjs --preflight-only
      - name: Run source checks and production dry-run
        run: |
          npm run typecheck
          npm test
          npm run worker:dry-run:production
      - name: Deploy isolated production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:${SOURCE_SHA}
      - name: Provision Runner-owned production bindings and verify readiness
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RUNNER_API_KEY_AGENT_API: ${{ secrets.RUNNER_API_KEY_AGENT_API }}
          RUNNER_PROFILE_DELEGATION_SECRET: ${{ secrets.RUNNER_PROFILE_DELEGATION_SECRET }}
          RUN_LAUNCH_ENCRYPTION_KEY: ${{ secrets.RUN_LAUNCH_ENCRYPTION_KEY }}
          EU_VM_WORKER_URL: ${{ secrets.EU_VM_WORKER_URL }}
          EU_VM_WORKER_TOKEN: ${{ secrets.EU_VM_WORKER_TOKEN }}
          GHA_WORKER_TOKEN_PRODUCTION_AGENT_API: ${{ secrets.GHA_WORKER_TOKEN_PRODUCTION_AGENT_API }}
          LLM_LADDER_TOKEN: ${{ secrets.LLM_LADDER_TOKEN }}
        run: node tools/deploy-cloudflare-production.mjs
