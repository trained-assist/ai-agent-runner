name: Deploy isolated production Cloudflare Runner API

on:
  workflow_dispatch:
    inputs:
      sandbox_run_id:
        description: Successful sandbox3 profile-auth deploy run for this exact source SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-runner-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RUNNER_API_URL: https://trained-assist-runner-api-production.skillset-apply.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact source and production prerequisites
        env:
          SANDBOX_RUN_ID: ${{ inputs.sandbox_run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SANDBOX_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'production environment secret CF_API_TOKEN is missing' >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || {
            echo 'production environment variable CF_ACCOUNT_ID must contain the target account ID' >&2
            exit 1
          }
          run="$(gh run view "$SANDBOX_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion,workflowName,headSha)"
          RUN_JSON="$run" node --input-type=module <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON);
          if (run.conclusion !== 'success'
            || run.workflowName !== 'Deploy and pair isolated sandbox3 live profile auth'
            || run.headSha !== process.env.GITHUB_SHA) {
            throw new Error('sandbox evidence must be a successful sandbox3 profile-auth deployment for this exact source SHA');
          }
          NODE
          identity="$(npx wrangler whoami 2>&1)"
          printf '%s\n' "$identity" | grep -F "$CLOUDFLARE_ACCOUNT_ID" >/dev/null || {
            echo 'Cloudflare credential does not target the configured production account' >&2
            exit 1
          }
      - name: Run source checks and production dry-run
        run: |
          npm run typecheck
          npm test
          npm run worker:dry-run:production
      - name: Deploy isolated, admission-closed production Worker
        run: npx wrangler deploy --config wrangler.production.jsonc --var BUILD_SHA:${GITHUB_SHA}
      - name: Verify deployed Worker health and exact source SHA
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 "$PRODUCTION_RUNNER_API_URL/healthz" > "$RUNNER_TEMP/runner-health.json"
          curl --fail --silent --show-error --max-time 10 "$PRODUCTION_RUNNER_API_URL/version" > "$RUNNER_TEMP/runner-version.json"
          python3 - "$RUNNER_TEMP/runner-health.json" "$RUNNER_TEMP/runner-version.json" "$GITHUB_SHA" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              health = json.load(handle)
          with open(sys.argv[2], encoding='utf-8') as handle:
              version = json.load(handle)
          if health.get('status') != 'ok' or health.get('placement') != 'cloudflare-worker':
              raise SystemExit('production Worker health response did not match the expected service')
          if version.get('buildSha') != sys.argv[3]:
              raise SystemExit('production Worker build SHA did not match the deployed source')
          print('Production Worker health and exact source SHA verified; run admission remains disabled.')
          PY
