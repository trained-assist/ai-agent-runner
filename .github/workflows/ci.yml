name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: VM worker WIF issuer security contract
        run: node --test test/vm-worker-wif-issuer.test.mjs
      - name: Read-only sandbox API inventory regressions
        run: python3 -m unittest discover -s test -p 'test_sandbox*.py'
