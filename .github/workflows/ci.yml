name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical MCP proof contract
        uses: actions/checkout@v4
        with:
          repository: trained-assist/trained-assist-mcp-host
          ref: main
          path: mcp-host-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Enable the canonical MCP proof fixture when published
        env:
          MCP_HOST_CONTRACT_PATH: ${{ github.workspace }}/mcp-host-contract/contracts/runner-mcp-proof/v1/contract.json
        run: |
          if [[ -f "$MCP_HOST_CONTRACT_PATH" ]]; then
            printf 'MCP_RUN_PROOF_CONTRACT=%s\n' "$MCP_HOST_CONTRACT_PATH" >> "$GITHUB_ENV"
          else
            echo 'MCP Host main does not publish the proof fixture yet; the gated cross-repository contract test will skip.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm test
      - name: Validate production Runner Worker bundle
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production Runner Worker bundle
        run: npm run worker:dry-run:production
      - name: VM worker WIF issuer security contract
        run: node --test test/vm-worker-wif-issuer.test.mjs
      - name: Read-only sandbox API inventory regressions
        run: python3 -m unittest discover -s test -p 'test_sandbox*.py'
