name: OpenCode fork promotion

# Хук продвижения сборки форка OpenCode MEM.
#
# Расписание только замечает кандидата: если последний опубликованный
# mem-preview релиз форка указывает на другой коммит, чем пин в
# `vm-worker-release.yml`, запускается гейт. Промоушен (смена пина и, дальше,
# подписанный релиз воркера на france) происходит ТОЛЬКО после зелёного
# гейта. Красный гейт оставляет всё как есть и публикует решение артефактом.
#
# Почему не автоматом: подмена бинаря на воркере — это то, что реально
# обслуживает задачи. Пока гейт не прошёл, кандидат не должен никуда попадать.

on:
  schedule:
    - cron: '41 */6 * * *'
  # Тот же путь, что и по расписанию, но без ожидания ближайшего тика: пуш в
  # ветку `opencode-promotion-run` немедленно перезапускает детектор и гейт.
  push:
    branches: [opencode-promotion-run]
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Fork release tag to gate instead of the detected latest
        required: false
        type: string
      candidate_source:
        description: Source commit SHA that the tag must pin
        required: false
        type: string
      candidate_archive_sha256:
        description: sha256 of opencode-linux-x64.tar.gz in that release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: opencode-fork-promotion
  cancel-in-progress: false

jobs:
  detect:
    name: Detect a fork release that is not the active build
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.decide.outputs.status }}
      tag: ${{ steps.decide.outputs.candidate_tag }}
      source_commit: ${{ steps.decide.outputs.candidate_source_commit }}
      archive_sha256: ${{ steps.decide.outputs.candidate_archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolve the pinned OpenCode build from the worker release pin
        id: active
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { readOpenCodePin } from "./scripts/update-opencode-release-pin.mjs";
            const pin = readOpenCodePin(readFileSync("deploy/vm-worker/opencode-release-pin.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `source_commit=${pin.OPENCODE_SOURCE_SHA}\ntag=${pin.OPENCODE_RELEASE_TAG}\n`);
          '
      - name: Fetch published fork releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp 'repos/gpt-mem/opencode-mem/releases?per_page=100' > "$RUNNER_TEMP/opencode-releases.json"
      - name: Decide whether the latest release is a promotion candidate
        id: decide
        env:
          ACTIVE_SOURCE: ${{ steps.active.outputs.source_commit }}
          ACTIVE_TAG: ${{ steps.active.outputs.tag }}
          OVERRIDE_TAG: ${{ inputs.candidate_tag }}
          OVERRIDE_SOURCE: ${{ inputs.candidate_source }}
          OVERRIDE_ARCHIVE: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          if [[ -n "$OVERRIDE_TAG" ]]; then
            {
              echo "status=candidate"
              echo "candidate_tag=$OVERRIDE_TAG"
              echo "candidate_source_commit=$OVERRIDE_SOURCE"
              echo "candidate_archive_sha256=$OVERRIDE_ARCHIVE"
            } >> "$GITHUB_OUTPUT"
            echo "Gating the manually requested candidate $OVERRIDE_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/opencode-promotion-candidate.mjs "$RUNNER_TEMP/opencode-releases.json" "$ACTIVE_SOURCE" "$ACTIVE_TAG"

  gate:
    name: Gate the candidate before anything is promoted
    needs: detect
    if: needs.detect.outputs.status == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download the candidate archive from the fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion"
          gh release download "${{ needs.detect.outputs.tag }}" \
            --repo gpt-mem/opencode-mem \
            --pattern opencode-linux-x64.tar.gz \
            --pattern opencode-linux-x64.tar.gz.sha256 \
            --dir "$RUNNER_TEMP/promotion"
      - name: Verify provenance, then run the runner e2e against the candidate binary
        run: |
          set -euo pipefail
          node scripts/opencode-promotion-gate.mjs \
            --candidate-tag "${{ needs.detect.outputs.tag }}" \
            --candidate-source "${{ needs.detect.outputs.source_commit }}" \
            --archive-sha256 "${{ needs.detect.outputs.archive_sha256 }}" \
            --archive-path "$RUNNER_TEMP/promotion/opencode-linux-x64.tar.gz" \
            --work-dir "$RUNNER_TEMP/promotion" \
            --repo-root "$GITHUB_WORKSPACE"
      - name: Keep the promotion decision as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-decision
          path: ${{ runner.temp }}/promotion/promotion-decision.json
          if-no-files-found: warn

  promote:
    name: Pin the verified candidate and open the release PR
    needs: [detect, gate]
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: promotion-decision
          path: ${{ runner.temp }}/promotion
      - name: Re-pin the fork build to the gated candidate
        id: pin
        run: |
          set -euo pipefail
          node scripts/update-opencode-release-pin.mjs \
            "$RUNNER_TEMP/promotion/promotion-decision.json" \
            deploy/vm-worker/opencode-release-pin.json
          if git diff --quiet -- deploy/vm-worker/opencode-release-pin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The worker release pin already points at ${{ needs.detect.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open a pull request that carries the verified pin
        if: steps.pin.outputs.changed == 'true'
        id: pull
        env:
          # PR и merge делаем токеном из секретов, а не github.token: PR,
          # созданный токеном Actions, не запускает CI на своей ветке, и
          # зелёного прогона на самое промоушен никогда не было бы. Токен
          # хранится в секрете репозитория, значение нигде не печатается.
          GH_TOKEN: ${{ secrets.PROMOTION_GITHUB_TOKEN || github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          SOURCE: ${{ needs.detect.outputs.source_commit }}
        run: |
          set -euo pipefail
          branch="opencode-promotion/$TAG"
          git config user.name "opencode-promotion"
          git config user.email "opencode-promotion@users.noreply.github.com"
          # Ветку и пуш в main строим от свежего origin/main: пока гейт
          # шёл, репозиторий мог уехать вперёд, и тогда форвард-пуш был бы
          # отклонён. Сохраняем точный пин, который проверил гейт, и
          # накладываем его поверх актуального main.
          git fetch origin main
          cp deploy/vm-worker/opencode-release-pin.json "$RUNNER_TEMP/pin.json"
          git checkout -B "$branch" origin/main
          cp "$RUNNER_TEMP/pin.json" deploy/vm-worker/opencode-release-pin.json
          git add deploy/vm-worker/opencode-release-pin.json
          git commit -m "chore(vm-worker): pin verified OpenCode fork $TAG"
          # Ветка принадлежит хуку: она может остаться от прошлой попытки,
          # поэтому перезаписываем её целиком, а не форвардим.
          git push --force origin "$branch"
          body="$(printf 'The promotion gate passed for `%s` (`%s`).\n\nThis pins the verified fork build so the next signed `vm-worker-v*` release bundles it, and the France deploy job installs that release.\n\nEvidence: the `promotion-decision` artifact of run %s.\n' "$TAG" "$SOURCE" "$GITHUB_RUN_ID")"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr comment "$branch" --body "$body"
          elif gh pr create --title "chore(vm-worker): pin verified OpenCode fork $TAG" --body "$body" --head "$branch" --base main; then
            echo "Opened pull request for $branch"
          else
            # Политика репозитория может запрещать токену Actions создавать PR.
            # Тогда гейт — единственная ревизия: он проверил происхождение
            # сборки и прогнал e2e раннера против кандидата. Поэтому пин
            # доезжает до main сам, быстрым форвард-пушем: если main уехал
            # вперёд, пуш будет отклонён и пин останется ждать следующего
            # прогона хука.
            echo "GitHub Actions may not open pull requests in this repository; landing the gated pin on main directly." >&2
            git push origin "HEAD:refs/heads/main"
            echo "- landed on main directly: \`true\`" >> "$GITHUB_STEP_SUMMARY"
            # Ни ветки, ни PR нет, пин уже в main: шаг merge должен
            # пропуститься, иначе он упрётся в `gh pr view` и завалит
            # промоушен, который уже отработал.
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Merge the promotion pull request once its CI is green
        if: steps.pin.outputs.changed == 'true' && steps.pull.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_GITHUB_TOKEN || github.token }}
          BRANCH: ${{ steps.pull.outputs.branch }}
        run: |
          set -euo pipefail
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "Pull request for $BRANCH is gone; main already carries the gated pin."
            exit 0
          fi
          # Сливаем только на зелёном CI: это и есть ревизия, которая раньше
          # закрывалась ручным merge. Прогон раннера идёт 10-20 минут, поэтому
          # ждём явно, а не полагаемся на auto-merge (на репозитории он выключен).
          # Разбор проверок живёт в scripts/promotion-pr-checks.mjs: у PR их
          # несколько, и сравнение списка с одним значением никогда не давало
          # «зелёного» PR, а значит и merge.
          deadline=$((SECONDS + 3600))
          without_checks=0
          while (( SECONDS < deadline )); do
            state="$(gh pr view "$BRANCH" --json state,statusCheckRollup | node scripts/promotion-pr-checks.mjs 2>/dev/null || echo unreachable)"
            case "$state" in
              green)
                echo "Checks on $BRANCH are green; merging."
                gh pr merge "$BRANCH" --merge --delete-branch
                echo "- promotion pull request merged: \`true\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              merged)
                echo "Pull request for $BRANCH is already merged."
                echo "- promotion pull request merged: \`true\` (already merged)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              failed)
                echo "Checks on $BRANCH failed; leaving the pull request open for review." >&2
                echo "- promotion pull request merged: \`false\` (checks failed)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              none)
                # PR без запущенных проверок не может быть ревизией: токен
                # Actions не запускает CI на своей ветке. Если секрета с
                # токеном нет, ждать тут нечего — гейт и есть ревизия, и пин
                # доезжает до main сам.
                without_checks=$((without_checks + 60))
                if (( without_checks >= 600 )); then
                  echo "No CI started on $BRANCH within ten minutes; landing the gated pin on main directly." >&2
                  git fetch origin main
                  git rebase origin/main
                  git push origin "HEAD:refs/heads/main"
                  echo "- promotion pull request merged: \`false\` (no CI on the pull request; landed on main directly)" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                ;;
            esac
            echo "Waiting for checks on $BRANCH ($state)"
            sleep 60
          done
          echo "Checks on $BRANCH did not finish within an hour; the next hook run resumes the promotion." >&2
          echo "- promotion pull request merged: \`false\` (checks still running)" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarise the promotion
        run: |
          {
            echo "### OpenCode fork promotion"
            echo "- candidate: \`${{ needs.detect.outputs.tag }}\` (\`${{ needs.detect.outputs.source_commit }}\`)"
            echo "- pin updated: \`${{ steps.pin.outputs.changed }}\`"
            echo "- promotion pull request: \`${{ steps.pull.outputs.branch || 'direct to main' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Cut a signed worker release that serves the pinned build
    # Цикл замыкается здесь, а не в промоушене: прод обслуживает последний
    # подписанный релиз, а не ветку main. Поэтому отставшим считается любой
    # коммит main, чей пин отличается от того, что лежит в последнем релизе
    # `vm-worker-v*` — будь пин там положил промоушен, падение деплой-части
    # прошлого цикла, или ручная правка. Решение принимает скрипт по двум
    # файлам пина, так что человек в цикл не входит ни на одном шаге.
    needs: [detect, promote]
    # Релиз режется по сверке пина, а не по исходу промоушена: даже если
    # промоушен упал, пин в main может уже обслуживаться не той сборкой,
    # и починка не должна ждать следующего тика расписания.
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Plan the worker release against the newest signed release
        id: plan
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin --tags --force
          git show origin/main:deploy/vm-worker/opencode-release-pin.json > "$RUNNER_TEMP/main-pin.json"
          latest="$(node -e '
            const { execFileSync } = require("node:child_process");
            const tags = execFileSync("git", ["tag", "--list", "vm-worker-v*"], { encoding: "utf8" })
              .split("\n").filter(Boolean)
              .filter((tag) => /^vm-worker-v\d+\.\d+\.\d+$/.test(tag))
              .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            process.stdout.write(tags.at(-1) ?? "");
          ')"
          args=(--main-pin "$RUNNER_TEMP/main-pin.json")
          if [[ -n "$latest" ]]; then
            args+=(--latest-tag "$latest")
            if git show "$latest:deploy/vm-worker/opencode-release-pin.json" > "$RUNNER_TEMP/latest-pin.json" 2>/dev/null; then
              args+=(--latest-pin "$RUNNER_TEMP/latest-pin.json")
            fi
          fi
          node scripts/vm-worker-release-plan.mjs "${args[@]}"
      - name: Release the worker with the pinned build
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Релиз неизменяемый, тег vm-worker-vX.Y.Z; сборка и деплой
          # проверяют подпись, дайджесты и метаданные бандла, а недовый
          # процесс откатывается на прежний релиз.
          # Идентичность коммита и тега задаём явно: на раннере воркера её
          # нет, и коммит падал с "empty ident name".
          git config user.name "opencode-promotion"
          git config user.email "opencode-promotion@users.noreply.github.com"
          git fetch origin main
          git checkout -B release/promotion origin/main
          TAG="$(node -p "require('./deploy/vm-worker/opencode-release-pin.json').OPENCODE_RELEASE_TAG")"
          current="$(node -p "require('./package.json').version")"
          next="$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.stdout.write(`${a}.${b}.${c+1}`)' "$current")"
          if git rev-parse "refs/tags/vm-worker-v$next" >/dev/null 2>&1; then
            echo "Tag vm-worker-v$next already exists; a concurrent run released the pinned build" >&2
            exit 0
          fi
          npm version --no-git-tag-version --allow-same-version "$next" >/dev/null
          git add package.json package-lock.json
          git commit -m "chore: bump VM worker to v$next with the gated OpenCode fork build"
          # main мог уехать вперёд, пока резался релиз: тогда коммит бомпа
          # переносим на свежий main и пушим ещё раз.
          if ! git push origin "HEAD:refs/heads/main"; then
            git fetch origin main
            git rebase origin/main
            git push origin "HEAD:refs/heads/main"
          fi
          git tag -a "vm-worker-v$next" -m "vm-worker v$next: OpenCode fork $TAG" HEAD
          git push origin "vm-worker-v$next"
          # GITHUB_TOKEN push of a tag does not trigger workflows; dispatch explicitly.
          gh workflow run vm-worker-release.yml -f build_tag=vm-worker-v$next
          echo "- worker release: \`vm-worker-v$next\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Note the release is already serving the pin
        if: steps.plan.outputs.needed != 'true'
        run: |
          echo "- worker release serving the pin: \`${{ steps.plan.outputs.latest_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
