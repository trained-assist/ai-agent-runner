name: p30-fleet-probe

# Приёмка P30 (карточка #69, этап I10): multi-worker/region contract на двух настоящих
# процессах API/Runner одной машины в РАЗНЫХ регионах (sandbox-ru / sandbox-eu).
# Проба поднимает воркеров, переживает управляемый сбой процесса (SIGKILL), гасит воркеров
# сама; состояние прогона изолировано в fleet-root этого job.
#
# Fleet-root и транскрипт — только внутри рабочего каталога job: /tmp и домашний каталог
# раннера проба не трогает.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

      - name: Чистая песочница (новый namespace эксперимента, два региона)
        run: |
          scripts/recreate-sandbox.sh \
            --namespace p30-ci \
            --fleet-root "$PWD/.p30-fleet" \
            --owner "$(id -un)" \
            --regions sandbox-ru,sandbox-eu \
            --placement scripts/fixtures/p30-sandbox-placement-policy.json \
            --client-engines fake,opencode,claude,codex

      - name: Проба multi-worker/region contract
        run: node scripts/p30-fleet-probe.mjs --fleet-root "$PWD/.p30-fleet" --namespace p30-ci --out "$PWD/.p30-fleet/out"

      - name: Транскрипт в артефакт job
        if: always()
        run: |
          set -uo pipefail
          if [ -f .p30-fleet/out/transcript.sha256 ]; then
            (cd .p30-fleet/out && sha256sum -c transcript.sha256)
            {
              echo '### Проба multi-worker/region (P30, I10)'
              echo '```'
              cat .p30-fleet/out/transcript.sha256
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Транскрипт sanitized-по-конструкции; наружу уходит только он, а не весь
            # fleet-root, в котором лежат свежие ключи песочницы и данные прогонов.
            tar -czf "$RUNNER_TEMP/p30-fleet-transcript.tgz" -C .p30-fleet/out .
          else
            echo 'транскрипт не собран' >&2
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p30-fleet-transcript
          path: ${{ runner.temp }}/p30-fleet-transcript.tgz
          retention-days: 14

      - name: Секреты песочницы не попали в транскрипт (повторная проверка в CI)
        if: always()
        run: |
          set -euo pipefail
          if grep -q 'ak_' .p30-fleet/out/transcript.json; then
            echo 'в транскрипте есть значение ключа' >&2
            exit 1
          fi
          echo 'значений ключей в транскрипте нет'